[project]
name = "mcp-rag-chat-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohammad Jamil", email = "mnnit.jamil@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "google-genai>=2.28.0",
    "mcp>=2.3.0",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.65.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mcp_rag_chat"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
